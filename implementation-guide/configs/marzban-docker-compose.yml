services:
  marzban:
    image: gozargah/marzban:latest
    restart: always
    container_name: marzban
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    volumes:
      - /opt/marzban:/var/lib/marzban
      - /opt/marzban/logs:/var/log/marzban
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11
    restart: always
    container_name: marzban-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MARZBAN_DB_PASS}
      MYSQL_DATABASE: marzban
      MYSQL_USER: marzban
      MYSQL_PASSWORD: ${MARZBAN_DB_PASS}
    volumes:
      - /opt/marzban/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: always
    container_name: marzban-nginx
    ports:
      - "8444:443"
    volumes:
      - /opt/marzban/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/REPLACE_ME_DOMAIN/fullchain.pem:/etc/ssl/certs/server.crt:ro
      - /etc/letsencrypt/live/REPLACE_ME_DOMAIN/privkey.pem:/etc/ssl/private/server.key:ro
    depends_on:
      - marzban
