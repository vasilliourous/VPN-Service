# /etc/nginx/sites-available/api
# Reverse proxy for activation API

limit_req_zone $binary_remote_addr zone=activation:10m rate=5r/m;

server {
    listen 443 ssl http2;
    server_name api.REPLACE_ME_DOMAIN;
    
    ssl_certificate /etc/letsencrypt/live/REPLACE_ME_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_ME_DOMAIN/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    
    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Rate limit activation requests (5 per minute per IP)
        limit_req zone=activation burst=5 nodelay;
        
        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
    
    # Block access to admin endpoints from non-whitelisted IPs
    location ~ ^/api/v1/admin/ {
        # Uncomment and add your management IP:
        # allow YOUR_MANAGEMENT_IP;
        deny all;
        
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
