# /etc/nginx/sites-available/fallback
# Serves as probe absorption for VLESS-REALITY
# Unauthenticated probes get forwarded here by Xray

server {
    listen 127.0.0.1:8080;
    
    server_name _;
    
    root /var/www/fallback;
    index index.html;
    
    location / {
        try_files $uri $uri/ =404;
    }
    
    # Block access to hidden files
    location ~ /\. {
        deny all;
    }
    
    # Rate limiting for probes
    limit_req_zone $binary_remote_addr zone=probe:10m rate=10r/s;
    limit_req zone=probe burst=20 nodelay;
    
    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy strict-origin-when-cross-origin;
}

# Separate server for the actual domain (serves Let's Encrypt + panel)
server {
    listen 127.0.0.1:8443 ssl http2;
    
    ssl_certificate /etc/letsencrypt/live/REPLACE_ME_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_ME_DOMAIN/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    
    server_name REPLACE_ME_DOMAIN;
    
    root /var/www/fallback;
    index index.html;
    
    location / {
        try_files $uri $uri/ =404;
    }
}
