# Locus V5 CI/CD Pipeline — Wails Edition
#
# CANONICAL WORKFLOW — this is the ONLY workflow file.
# GitHub Actions only executes workflows from .github/workflows/ at the
# repository ROOT. The old Fyne workflow previously lived here; the Wails
# rewrite was accidentally placed in v5/.github/workflows/ and never ran.
#
# Builds and releases the Locus desktop client (Wails v2 + Vue 3).
#
# IMPORTANT: The UI is embedded via the `frontend` build tag (see
# v5/client/assets_embed.go — //go:embed all:frontend/dist). The frontend MUST
# be built BEFORE any `go build -tags frontend` step runs, otherwise the
# compiler fails with:
#   assets_embed.go: pattern all:frontend/dist: no matching files found
#
# Without the tag, assets_stub.go compiles (empty FS) — usable for headless
# checks, but CI always passes the tag to ship the real UI.
#
# Triggered by:
#   - Push to main (test build only)
#   - Tag push v* (full build + release)
#   - Pull request (test build)
#
# Working directory: v5/client/

name: Build Locus V5

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: write

env:
  CLIENT_DIR: v5/client
  FRONTEND_DIR: v5/client/frontend

jobs:
  # ── Lint + Test + Vet (Ubuntu) ──
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.CLIENT_DIR }}
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: true
          # Both go.mod and go.sum are committed, so this glob resolves the
          # Go module cache deterministically.
          cache-dependency-path: ${{ env.CLIENT_DIR }}/go.{mod,sum}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Wails needs WebKitGTK headers on Linux (CGO).
      # libayatana-appindicator3-dev provides the ayatana-appindicator3-0.1
      # pkg-config file that getlantern/systray (internal/tray) compiles against.
      - name: Install Linux webview deps (Wails)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      # ── Frontend MUST be built before Go compiles (//go:embed) ──
      - name: Build frontend (required for //go:embed)
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          npm install
          npm run build
          ls -la dist

      # ── Admin console ──
      # Not shipped in the client, but a broken console is a broken operations
      # tool — and the failure mode (wrong `base`, so every asset 404s behind
      # /admin/) is silent until someone opens the page. Compile it here so a
      # change that breaks the build is caught in CI rather than at deploy time.
      - name: Build admin console
        working-directory: ${{ github.workspace }}/v5/console
        run: |
          npm install --no-audit --no-fund
          npm run build
          ls -la dist
          # Guard the /admin base path — see vite.config.ts
          grep -q '/admin/assets/' dist/index.html || {
            echo "::error::console index.html does not reference /admin/assets/ — check 'base' in v5/console/vite.config.ts"
            exit 1
          }

      # Generates go.sum (not committed) — required for `go build`
      - name: go mod tidy
        run: go mod tidy

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: ${{ env.CLIENT_DIR }}

      - name: go vet
        # Use the real Wails tags so vet checks the desktop implementation.
        # webkit2_41: ubuntu-latest ships WebKitGTK 4.1 only — the Wails linux
        # cgo code needs this tag or it looks for webkit2gtk-4.0.
        run: go vet -tags "frontend desktop production webkit2_41" ./...

      - name: Build check (compile test)
        # -tags frontend embeds the real UI (frontend/dist was built above);
        # desktop+production are REQUIRED — without them Wails compiles the
        # stub app that shows the "correct build tags" error at runtime;
        # webkit2_41 matches the WebKitGTK version on ubuntu-latest.
        run: go build -tags "frontend desktop production webkit2_41" ./...

      # Version consistency. The client version is duplicated in v5/VERSION
      # (canonical), main.go's fallback, internal/buildinfo's fallback,
      # wails.json and frontend/package.json. When they drift, the binary's
      # diagnostics, installer metadata and update comparisons disagree — and
      # the failure surfaces as an unexplainable client behaviour weeks later.
      # Fail the build here instead. (Also covered by version_consistency_test.go.)
      - name: Check version consistency
        working-directory: ${{ github.workspace }}
        run: |
          V=$(tr -d '[:space:]' < v5/VERSION)
          echo "v5/VERSION = $V"
          fail=0
          grep -q "\"version\": \"$V\"" v5/client/wails.json || {
            echo "::error::v5/client/wails.json version does not match v5/VERSION ($V)"; fail=1; }
          grep -q "\"version\": \"$V\"" v5/client/frontend/package.json || {
            echo "::error::v5/client/frontend/package.json version does not match v5/VERSION ($V)"; fail=1; }
          grep -q "var version = \"$V\"" v5/client/main.go || {
            echo "::error::main.go fallback version does not match v5/VERSION ($V)"; fail=1; }
          grep -q "fallbackVersion = \"$V\"" v5/client/internal/buildinfo/buildinfo.go || {
            echo "::error::internal/buildinfo fallback version does not match v5/VERSION ($V)"; fail=1; }
          # The go:generate directive rebuilds the Windows .syso (which stamps the
          # exe's file/product version). A stale number here ships a Windows
          # binary whose Properties tab disagrees with the app's own version.
          grep -q -- "--product-version $V --file-version $V" v5/client/main.go || {
            echo "::error::main.go go:generate product/file version does not match v5/VERSION ($V)"; fail=1; }
          # ...and the ARTIFACTS must match too, checked here with no toolchain at
          # all. This is the cheap, self-explaining guard; the Go test below is
          # the authoritative one. It runs FIRST so a stale .syso is attributed
          # to a stale artifact rather than looking like a Go test failure --
          # which is how the 2.2.7 release was misread.
          python3 v5/server/scripts/stamp-syso.py "$V" --check --quiet || {
            echo "::error::committed rsrc_windows_*.syso are stale for $V — run: python3 v5/server/scripts/stamp-syso.py $V"; fail=1; }
          # A correct DIRECTIVE does not mean the ARTIFACTS are current.
          # Nothing re-runs `go generate` automatically, so the committed .syso
          # files can be stale while every text check above passes. That is
          # exactly what shipped in 2.1.0: version_consistency_test.go's
          # TestCommittedSysoMatchesRepoVersion reads the version OUT of the
          # binaries. Run it explicitly here so the failure is attributed to
          # versioning rather than looking like a test error.
          ( cd v5/client && go test ./internal/winres/... -run TestCommittedSysoMatchesRepoVersion -count=1 ) || {
            echo "::error::committed rsrc_windows_*.syso is stale — run: cd v5/client && go generate -tags windows"; fail=1; }
          # npm lockfile root + packages[""] must match too. The lockfile is
          # NOT read by any build step, so it drifted silently from 2.0.0 to
          # 2.2.0 across two releases and nothing noticed. It is harmless while
          # CI runs `npm install`, but it becomes a hard failure the day anyone
          # switches to `npm ci` — so assert it now, while it is cheap.
          ( cd v5/client && go test . -run TestFrontendLockfileVersionMatchesRepoVersion -count=1 ) || {
            echo "::error::frontend/package-lock.json version does not match v5/VERSION"; fail=1; }
          # The inverse guard: every copy of the version must be one we maintain.
          # The checks above assert the copies we KNOW ABOUT agree; none of them
          # can notice a NEW copy appearing (a version constant in a new package,
          # a hardcoded value in the UI). That is how drift recurs, so fail on
          # any unaccounted occurrence rather than discovering it in a shipped
          # binary.
          ( cd v5/client && go test . -run TestNoUnaccountedCopyOfVersion -count=1 ) || {
            echo "::error::an unaccounted copy of the version exists — add it to KNOWN_VERSION_FILES in v5/server/scripts/bump-version.sh"; fail=1; }
          # On a v* tag the tag itself must match v5/VERSION, or CI would publish
          # a release whose binary reports a different version than its tag.
          case "${{ github.ref }}" in
            refs/tags/v*)
              TAG="${GITHUB_REF_NAME#v}"
              if [ "$TAG" != "$V" ]; then
                echo "::error::tag ${{ github.ref_name }} does not match v5/VERSION ($V)"
                fail=1
              fi ;;
          esac
          exit $fail

      - name: Run unit tests
        run: go test ./... -v -count=1

  # ── Build + Bundle for all platforms ──
  build:
    name: Build ${{ matrix.label }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            cgo: "1"   # Wails needs CGO for WebKitGTK
            tags: "frontend desktop production webkit2_41"  # ubuntu-latest ships WebKitGTK 4.1
          - label: macOS-amd64
            os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
            cgo: "1"   # Wails needs CGO for WKWebView
            tags: "frontend desktop production"
          - label: macOS-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
            cgo: "1"   # Wails needs CGO for WKWebView
            tags: "frontend desktop production"
          - label: Windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
            cgo: "0"   # Wails Windows is pure Go (WebView2 COM) — no gcc needed
            tags: "frontend desktop production"

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ env.CLIENT_DIR }}
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
          cache: true
          # go.sum doesn't exist until the first `go mod tidy` run — glob so
          # go.mod (committed) resolves the cache path; go.sum adds once committed
          cache-dependency-path: ${{ env.CLIENT_DIR }}/go.{mod,sum}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Wails needs WebKitGTK headers on Linux (CGO).
      # libayatana-appindicator3-dev provides the ayatana-appindicator3-0.1
      # pkg-config file that getlantern/systray (internal/tray) compiles against.
      - name: Install Linux webview deps (Wails)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      # Diagnostic: show the repo layout so future path issues are obvious
      - name: "Debug: show client dir"
        run: |
          pwd
          echo "--- v5/client ---"
          ls -la
          echo "--- main.go present? ---"
          test -f main.go && echo "YES: main.go exists (build target .)" || echo "NO main.go"
          test -d cmd/locus && echo "YES: cmd/locus exists (legacy layout)" || echo "NO cmd/locus (expected — Wails layout)"

      # ── Frontend MUST be built before Go compiles (//go:embed) ──
      - name: Build frontend (required for //go:embed)
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          npm install
          npm run build

      - name: Build client app
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          # Single source for runtime version: prefer <repo>/v5/VERSION when on
          # main/PR (so non-tag builds already reflect the in-flight version);
          # on a tag push, override with the tag with its leading "v" stripped
          # (e.g. tag v2.0.1 -> version 2.0.1) so the updater's numeric compare
          # against the server's update_config version is exact.
          VERSION="$(cat "${{ github.workspace }}/v5/VERSION" 2>/dev/null || echo dev)"
          CASE_TAG="${{ github.ref_name }}"
          case "${CASE_TAG}" in v*) VERSION="${CASE_TAG#v}";; esac
          [ -z "$VERSION" ] && VERSION="dev"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          echo "Injecting runtime version: ${VERSION}"
          # On Windows, build as a GUI app (no console window)
          if [ "${{ matrix.goos }}" = "windows" ]; then
            LDFLAGS="$LDFLAGS -H windowsgui"
          fi
          go mod tidy
          # Build from the module root — main package lives at v5/client/main.go
          # -tags frontend embeds the real UI (frontend/dist was built above)
          # desktop+production are REQUIRED Wails tags — without them the
          # binary is the stub app that errors at runtime
          go build -tags "${{ matrix.tags }}" -ldflags="$LDFLAGS" \
            -o locus-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .

      # The raw executable the updater consumes must exist before packaging,
      # because both the Windows installer and the macOS bundle embed it rather
      # than fetching it at runtime — the whole reason the client exists is a
      # network where downloads are blocked, so a bootstrap download would fail
      # exactly where the app is needed most.
      - name: Download sing-box engine
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          SING_VERSION="1.12.1"
          case "${{ runner.os }}" in
            Linux)
              curl -sLO "https://github.com/SagerNet/sing-box/releases/download/v${SING_VERSION}/sing-box-${SING_VERSION}-linux-amd64.tar.gz"
              tar -xzf "sing-box-${SING_VERSION}-linux-amd64.tar.gz"
              cp "sing-box-${SING_VERSION}-linux-amd64/sing-box" .
              ;;
            macOS)
              curl -sLO "https://github.com/SagerNet/sing-box/releases/download/v${SING_VERSION}/sing-box-${SING_VERSION}-darwin-${{ matrix.goarch }}.tar.gz"
              tar -xzf "sing-box-${SING_VERSION}-darwin-${{ matrix.goarch }}.tar.gz"
              cp "sing-box-${SING_VERSION}-darwin-${{ matrix.goarch }}/sing-box" .
              ;;
            Windows)
              curl -sLO "https://github.com/SagerNet/sing-box/releases/download/v${SING_VERSION}/sing-box-${SING_VERSION}-windows-amd64.zip"
              unzip -qo "sing-box-${SING_VERSION}-windows-amd64.zip"
              cp "sing-box-${SING_VERSION}-windows-amd64/sing-box.exe" .
              ;;
          esac

      - name: Bundle into platform ZIP
        run: |
          mkdir -p dist
          BUNDLE="locus-${{ matrix.label }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path 'locus-${{ matrix.goos }}-${{ matrix.goarch }}.exe','sing-box.exe' -DestinationPath 'dist\\${BUNDLE}.zip' -Force"
          else
            zip -j "dist/${BUNDLE}.zip" \
              locus-${{ matrix.goos }}-${{ matrix.goarch }} \
              sing-box
          fi

      # ── Installer / disk image (in addition to the portable zip) ──
      #
      # The zip above REMAINS the portable artefact and still ships. These are
      # extra, so a student without admin rights — or running from a USB stick —
      # is not broken by the change.
      #
      # Why they exist: a portable copy run out of Downloads staged its own
      # update in that same directory, where Defender, SmartScreen and the
      # search indexer all hold handles on a freshly written .exe, so the
      # rename failed and the update could not be applied at all. Installing
      # into a directory the application owns removes the entire class of
      # problem. internal/install is the runtime half of this fix.
      - name: Build Windows installer (Inno Setup)
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          $version = (Get-Content "${{ github.workspace }}/v5/VERSION" -Raw).Trim()
          $caseTag = "${{ github.ref_name }}"
          if ($caseTag -like "v*") { $version = $caseTag.Substring(1) }
          Write-Host "Building Windows installer for version $version"

          # ISCC ships with Inno Setup 6, which the windows-latest runner image
          # already has. A missing compiler is a hard failure rather than a
          # silent skip: an installer that quietly does not exist is worse than
          # a build that stops, because the release would look complete.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "::error::Inno Setup 6 not found at $iscc — cannot build the installer"
            exit 1
          }

          # Pass absolute paths for both the inputs and the output.
          #
          # Inno Setup resolves a relative Source: and a relative OutputDir
          # against SourceDir, which defaults to the directory containing the
          # .iss script (v5/client/build/windows) — NOT the directory ISCC is
          # invoked from. This step runs from v5/client, where the binaries are
          # and where dist/ is expected, so relative paths made ISCC look for
          # the binaries in build/windows/ and write its output there too. Both
          # are passed as fully-qualified paths to remove the ambiguity.
          #
          # Built from github.workspace rather than the current location: an
          # absolute literal cannot silently resolve to the wrong directory
          # whatever the runner does when it starts pwsh.
          $clientDir = Join-Path "${{ github.workspace }}" "v5\client"
          $buildDir  = Join-Path $clientDir "dist"
          $iss       = Join-Path $clientDir "build\windows\locus.iss"

          # The script itself is passed absolutely for the same reason. A
          # relative "..\..\build\windows\locus.iss" resolves against the
          # runner's cwd; if that is ever not v5/client the compiler is handed
          # a path that does not exist and fails with a bare "file not found".
          if (-not (Test-Path -LiteralPath $iss)) {
            Write-Host "::error::Installer script not found: $iss"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null
          & $iscc "/DAppVersion=$version" "/DBuildDir=$clientDir" "/DOutputDirAbs=$buildDir" $iss
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Inno Setup compilation failed (exit $LASTEXITCODE)"
            exit 1
          }
          Get-ChildItem -LiteralPath $buildDir -Filter *.exe | Format-Table Name, Length

      - name: Build macOS disk image
        if: matrix.goos == 'darwin'
        run: |
          VERSION="$(cat "${{ github.workspace }}/v5/VERSION" 2>/dev/null || echo dev)"
          CASE_TAG="${{ github.ref_name }}"
          case "${CASE_TAG}" in v*) VERSION="${CASE_TAG#v}";; esac
          [ -z "$VERSION" ] && VERSION="dev"
          echo "Building disk image for version $VERSION (${{ matrix.goarch }})"
          mkdir -p dist
          # A DMG failure warns rather than fails the build. hdiutil is an
          # external packaging tool and the portable zip is still a complete
          # deliverable, so a packaging hiccup should not block the release —
          # but it must be visible, hence ::warning:: rather than silence.
          if ! bash ../../build/macos/make-dmg.sh \
                 "$VERSION" "${{ matrix.goarch }}" \
                 "locus-darwin-${{ matrix.goarch }}" \
                 "sing-box" \
                 dist; then
            echo "::warning::macOS disk image build failed — shipping the zip only"
          fi
          ls -lh dist

      # The auto-updater downloads a RAW EXECUTABLE and swaps it in place — it
      # cannot consume the .zip above (writing zip bytes over the running binary
      # would brick the install). So we also publish the bare client binary plus
      # its own .sha256 sidecar, in exactly the naming the server's release
      # layout expects: locus-<os>-<arch>[.exe] and the same name + .sha256.
      #
      # A DETERMINISTIC filename matters: the publish script derives the
      # update_config URLs from version + platform, so these names are a
      # contract between CI and the hub, not an implementation detail.
      - name: Stage raw updater artifacts
        run: |
          mkdir -p dist/raw
          SRC="locus-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          cp "$SRC" "dist/raw/$SRC"
          # sha256sum prints "<hash>  <path>"; keep the bare name so it can be
          # uploaded verbatim next to the binary.
          ( cd dist/raw && sha256sum "$SRC" > "$SRC.sha256" )
          echo "Staged raw artifacts:"
          ls -l dist/raw
          cat dist/raw/*.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: locus-${{ matrix.label }}
          path: |
            ${{ env.CLIENT_DIR }}/dist/*.zip
            ${{ env.CLIENT_DIR }}/dist/raw/*
            ${{ env.CLIENT_DIR }}/dist/*.dmg
            ${{ env.CLIENT_DIR }}/dist/*-setup-*.exe

  # ── Release (tag pushes only) ──
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      # download-artifact with merge-multiple restores the paths AS THEY WERE
      # UPLOADED, it does not flatten them. The build job uploads
      #   dist/*.zip        (the bundles)   -> arrive at the top level
      #   dist/raw/*        (the binaries)  -> arrive under raw/
      # Every step below therefore has to look in BOTH places. Assuming a flat
      # directory is what made "Generate updater manifest" find no artifacts at
      # all and fail, so no manifest.json was ever attached to a release.
      - uses: actions/download-artifact@v4
        with:
          pattern: locus-*
          merge-multiple: true

      - name: Normalise artifact layout
        run: |
          echo "=== as downloaded ==="
          find . -maxdepth 2 -type f | sort
          # Flatten raw/ into the top level so the manifest, checksums and
          # release-upload steps all see one directory. Names are already
          # unique across platforms, so a plain move is safe.
          if [ -d raw ]; then
            mv raw/* . 2>/dev/null || true
            rmdir raw 2>/dev/null || true
          fi
          echo "=== normalised ==="
          ls -l

      - name: Generate release checksums
        run: |
          # The human-facing deliverables: portable bundles, the Windows
          # installer and the macOS disk images. The raw per-platform binaries
          # are deliberately excluded — they are covered by manifest.json, and
          # mixing hashes of both in one file makes it ambiguous which artefact
          # a line refers to.
          shopt -s nullglob
          targets=( *.zip *.dmg *-setup-*.exe )
          if [ ${#targets[@]} -eq 0 ]; then
            echo "::error::no release bundles found — cannot generate checksums"
            exit 1
          fi
          # A Windows installer must exist: it is the fix for the update failure
          # this release is for, and a release published without it would look
          # complete while leaving those users stuck on the broken path.
          windows_setup=( *-setup-*.exe )
          if [ ${#windows_setup[@]} -eq 0 ]; then
            echo "::error::no Windows installer (*-setup-*.exe) was produced"
            exit 1
          fi
          sha256sum "${targets[@]}" > checksums.sha256
          cat checksums.sha256

      # Emit the per-version manifest the publish script uploads to the hub.
      # Keeping this in CI guarantees the hashes come from the same build that
      # produced the binaries, rather than being recomputed (and potentially
      # mismatched) at publish time.
      - name: Generate updater manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'PY' > manifest.json
          import hashlib, json, os, sys
          version = sys.argv[1]
          out = {"version": version, "platforms": {}}
          # NOTE: these keys are built from the LOWERCASE goos/goarch the build
          # step uses for -o (`locus-${{ matrix.goos }}-${{ matrix.goarch }}`),
          # e.g. "locus-linux-amd64" — they are NOT the artifact/zip labels
          # ("locus-Linux-amd64"). Getting this wrong yields an empty manifest
          # while still exiting 0, so the mapping is asserted below.
          mapping = {
              "locus-linux-amd64":   "linux",
              "locus-windows-amd64": "windows",
              "locus-darwin-amd64":  "macos_intel",
              "locus-darwin-arm64":  "macos_arm",
          }
          # Walk the tree instead of listing one directory. download-artifact
          # preserves the uploaded layout (raw/…) and an earlier revision of
          # this step only looked at the top level, found nothing, and failed
          # the whole release — so no manifest.json ever reached a release.
          # Searching is the fix that cannot silently regress on layout.
          found = {}
          for root, _dirs, files in os.walk("."):
              for base in files:
                  if not base.startswith("locus-") or base.endswith(".zip"):
                      continue
                  if base.endswith(".sha256"):
                      continue
                  stem, ext = os.path.splitext(base)
                  if stem not in mapping:
                      continue
                  path = os.path.join(root, base)
                  # Keep the top-level copy if the same artifact appears twice.
                  found.setdefault(stem, path)
          for stem, path in sorted(found.items()):
              out["platforms"][mapping[stem]] = {
                  "file": os.path.basename(path),
                  "sha256": hashlib.sha256(open(path, "rb").read()).hexdigest(),
                  "size": os.path.getsize(path),
              }
          missing = sorted(set(mapping.values()) - set(out["platforms"]))
          if missing:
              # Fail loudly: a partial manifest would silently withhold updates
              # from the missing platforms.
              sys.stderr.write("ERROR: no artifact found for: %s\n" % ", ".join(missing))
              sys.stderr.write("Files present:\n")
              for root, _dirs, files in os.walk("."):
                  for base in sorted(files):
                      sys.stderr.write("  %s\n" % os.path.join(root, base))
              sys.exit(1)
          print(json.dumps(out, indent=2, sort_keys=True))
          PY
          cat manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.dmg
            *-setup-*.exe
            locus-linux-amd64
            locus-windows-amd64.exe
            locus-darwin-amd64
            locus-darwin-arm64
            *.sha256
            checksums.sha256
            manifest.json
          generate_release_notes: true
          body: |
            ## Locus ${{ github.ref_name }}

            ### Installers (recommended)

            | Platform | File | Notes |
            |----------|------|-------|
            | Windows | `locus-setup-<version>.exe` | Installs to Program Files |
            | macOS | `locus-setup-<version>-macos-<arch>.dmg` | Drag into Applications |

            These install into a directory the application owns, so in-place
            self-update works. A portable copy run from Downloads fails to
            update: Windows will not let the updater rename a file that
            antivirus, SmartScreen or the search indexer has open, which is
            exactly where such a copy is running from.

            ### Portable bundles (still supported)

            | Platform | File |
            |----------|------|
            | Windows | `locus-Windows-amd64.zip` |
            | macOS Intel | `locus-macOS-amd64.zip` |
            | macOS Apple Silicon | `locus-macOS-arm64.zip` |
            | Linux | `locus-Linux-amd64.zip` |

            Extract and run — no installer, no admin rights. Updates are staged
            inside the app's own directory, so a portable copy works from any
            folder. Linux ships as a portable bundle only by design: nothing is
            written to `/usr` or `/opt`.

            ### macOS note (unsigned build)
            macOS Gatekeeper will block the unsigned app on first launch.
            Right-click the app → **Open** (or run `xattr -cr /Applications/Locus.app`)
            before first run. Both the .dmg and the zip carry a README with
            these steps. Signing is a known gap, handled separately.

            ### What's Included

            - `locus` — Desktop client (single binary, Wails + Vue 3)
            - `sing-box` — Tunnel engine (Shadowsocks + TUN, bundled)

            ### Quick Install

            **Windows:** run `locus-setup-<version>.exe`.
            **macOS:** open the `.dmg`, drag Locus into Applications, then
            right-click → Open the first time.
            **Linux:** extract the zip and run `./locus`.
            **Portable (any platform):** extract the zip and run the client.

            ### Updating

            The client updates itself from this release — no manual download.
            The hub must have fetched and published the version, and rollout
            must be above 0 for it to be offered.

            See `v5/docs/WAILS-MIGRATION.md` for architecture details and
            `v5/docs/BACKEND-API.md` for the backend API reference.
