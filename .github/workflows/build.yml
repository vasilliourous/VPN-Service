# MyVPN CI/CD Pipeline
#
# Builds and releases the MyVPN desktop client for Windows, macOS, and Linux.
# Uses native platform runners (no cross-compilation issues).
#
# Triggered by:
#   - Push to main (test build only)
#   - Tag push v* (full build + release)
#   - Pull request (test build)
#
# Source: v5/client/ (hardened client code)

name: Build MyVPN

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

permissions:
  contents: write
  actions: write

env:
  CLIENT_DIR: v5/client

jobs:
  # ── Lint + Vet + Test ──
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.CLIENT_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Fyne dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Tidy Go modules (generate go.sum)
        run: go mod tidy

      - name: Build first (prime module cache for CGO packages)
        run: CGO_ENABLED=1 go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ env.CLIENT_DIR }}
          only-new-issues: true
          skip-cache: true

      - name: go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./... -v -count=1

  # ── Build matrix: 4 platforms ──
  build:
    name: Build ${{ matrix.label }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            sing-box-url: "https://github.com/SagerNet/sing-box/releases/download/v1.10.0/sing-box-1.10.0-linux-amd64.tar.gz"
            sing-box-dir: "sing-box-1.10.0-linux-amd64"
            sing-box-bin: "sing-box"
          - label: macOS-amd64
            os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
            sing-box-url: "https://github.com/SagerNet/sing-box/releases/download/v1.10.0/sing-box-1.10.0-darwin-amd64.tar.gz"
            sing-box-dir: "sing-box-1.10.0-darwin-amd64"
            sing-box-bin: "sing-box"
          - label: macOS-arm64
            os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
            sing-box-url: "https://github.com/SagerNet/sing-box/releases/download/v1.10.0/sing-box-1.10.0-darwin-arm64.tar.gz"
            sing-box-dir: "sing-box-1.10.0-darwin-arm64"
            sing-box-bin: "sing-box"
          - label: Windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
            sing-box-url: "https://github.com/SagerNet/sing-box/releases/download/v1.10.0/sing-box-1.10.0-windows-amd64.zip"
            sing-box-dir: "sing-box-1.10.0-windows-amd64"
            sing-box-bin: "sing-box.exe"

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ env.CLIENT_DIR }}
        shell: bash

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Fyne deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Generate go.sum and download modules
        run: |
          go mod tidy
          go mod download

      - name: Build client
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          # macOS: use Fyne software renderer (ci tag) — avoids OpenGL dependency
          BUILD_TAGS=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            BUILD_TAGS="-tags ci"
          fi
          go build $BUILD_TAGS -ldflags="-s -w -X main.version=${VERSION}" \
            -o myvpn-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/myvpn/

      - name: Build TUN helper (no CGO)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 go build \
            -o myvpn-helper-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./internal/helper/

      - name: Download sing-box engine
        run: |
          curl -sLO "${{ matrix.sing-box-url }}"
          if [[ "${{ matrix.sing-box-url }}" == *.zip ]]; then
            unzip -qo "${{ matrix.sing-box-dir }}.zip"
          else
            tar -xzf "${{ matrix.sing-box-dir }}.tar.gz"
          fi
          cp "${{ matrix.sing-box-dir }}/${{ matrix.sing-box-bin }}" .

      - name: Bundle into platform ZIP
        run: |
          mkdir -p dist
          BUNDLE="myvpn-${{ matrix.label }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            zip -j "dist/${BUNDLE}.zip" \
              myvpn-${{ matrix.goos }}-${{ matrix.goarch }}.exe \
              ${{ matrix.sing-box-bin }} \
              myvpn-helper-${{ matrix.goos }}-${{ matrix.goarch }}.exe
          else
            zip -j "dist/${BUNDLE}.zip" \
              myvpn-${{ matrix.goos }}-${{ matrix.goarch }} \
              ${{ matrix.sing-box-bin }} \
              myvpn-helper-${{ matrix.goos }}-${{ matrix.goarch }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myvpn-${{ matrix.label }}
          path: ${{ env.CLIENT_DIR }}/dist/*.zip

  # ── Release (tag pushes only) ──
  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: myvpn-*
          merge-multiple: true

      - name: Generate release checksums
        run: |
          sha256sum *.zip > checksums.sha256
          cat checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            checksums.sha256
          generate_release_notes: true
          body: |
            ## MyVPN ${{ github.ref_name }}

            ### Bundles

            | Platform | File |
            |----------|------|
            | Windows | `myvpn-Windows-amd64.zip` |
            | macOS Intel | `myvpn-macOS-amd64.zip` |
            | macOS ARM | `myvpn-macOS-arm64.zip` |
            | Linux | `myvpn-Linux-amd64.zip` |

            ### What's Included

            - `myvpn` — Desktop client application (Go + Fyne)
            - `sing-box` — Tunnel engine (Shadowsocks + TUN)
            - `myvpn-helper` — Privileged TUN helper service

            ### Quick Start

            1. Download the bundle for your platform
            2. Extract the zip
            3. Launch `myvpn`
            4. Enter your activation code

            ### Build Info

            Built from `v5/client/` — see `v5/docs/CI-CD.md` for pipeline details.
